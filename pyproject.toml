[project]
name = "poor-word"
version = "0.1.0"
description = "AIGC Chinese malformed-glyph detection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<12",
  "pyarrow>=19,<20",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "scikit-image>=0.25,<1",
  "scikit-learn>=1.6,<2",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch==2.7.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torchvision==0.22.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "typer>=0.15,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
poor-word = "poor_word.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["gpu: requires the NVIDIA L20 experiment host"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["poor_word"]
